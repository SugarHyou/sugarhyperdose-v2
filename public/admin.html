<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Admin</title>
    <meta name="description" content="I’m obsessed with sweets to a probably-unhealthy degree!">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="assets/graphics/favicons/X.gif" type="image/x-icon">
    <link rel="stylesheet" href="stylesheet.css">
    <style>
        .admin-input, .admin-textarea {
            width: 100%;
            font-family: inherit;
            margin-top: 5px;
            margin-bottom: 15px;
            padding: 8px;
            border: 2px inset var(--purple);
            color: inherit;
        }
        .admin-textarea {
            height: 120px;
            resize: vertical;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .tab-btn.active {
            background: var(--purple);
            color: white;
        }
    </style>
</head>

<body class="flex wrap">

    <div id="center-container" class="flex justify-center align-center wrap" style="width: 100%;">
        <div class="admin-window window" style="width: 420px;">
            <div class="title-bar flex">
                <span>Admin.exe</span>
                <div class="title-bar-controls flex">
                    <span class="maximize flex justify-center align-center">🗖</span>
                    <span class="close flex justify-center align-center">X</span>
                </div>
            </div>
            
            <div class="admin-tabs flex" style="margin-bottom: 15px; gap: 5px; padding: 5px;">
                <button id="tab-blog-btn" class="player-btn tab-btn active">Blog Post</button>
                <button id="tab-status-btn" class="player-btn tab-btn">Site Status</button>
                <button id="tab-media-btn" class="player-btn tab-btn">Current Media</button>
            </div>

            <div class="admin-body">
                <div id="tab-blog-content">
                    <label>Post Title:</label>
                    <input type="text" id="post-title" class="admin-input" placeholder="What's on your mind?">
                    <label>Post Content (HTML allowed):</label>
                    <textarea id="post-content" class="admin-textarea" placeholder="Type your blog post here..."></textarea>

                    <button id="publish-btn" class="player-btn" style="width: 100%; padding: 10px; cursor: pointer;">Publish Post</button>
                    <div id="status-msg" style="margin-top: 10px; text-align: center;"></div>
                </div>

                <div id="tab-status-content" style="display: none;">
                    <label>Site Status:</label>
                    <select id="status-select" class="admin-input">
                        <option value="ONLINE">● ONLINE</option>
                        <option value="OFFLINE">● OFFLINE</option>
                    </select>

                    <button id="save-status-btn" class="player-btn" style="width: 100%; padding: 10px; cursor: pointer;">Update Status</button>
                    <div id="status-setting-msg" style="margin-top: 10px; font-size: 14px; text-align: center;"></div>
                </div>

                <div id="tab-media-content" style="display: none;">
                    <label>Currently Playing:</label>
                    <input type="text" id="media-playing" class="admin-input" placeholder="e.g. Persona 5">
                    
                    <label>Currently Watching:</label>
                    <input type="text" id="media-watching" class="admin-input" placeholder="e.g. Chainsaw Man">
                    
                    <label>Currently Reading / Listening:</label>
                    <input type="text" id="media-reading" class="admin-input" placeholder="e.g. Nana">

                    <button id="save-media-btn" class="player-btn" style="width: 100%; padding: 10px; cursor: pointer;">Update Media</button>
                    <div id="media-setting-msg" style="margin-top: 10px; font-size: 14px; text-align: center;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
