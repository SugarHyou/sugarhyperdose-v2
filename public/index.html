                <div class="title-bar-controls flex">
                    <span class="maximize flex justify-center align-center">🗖</span>
                    <span class="close flex justify-center align-center">X</span>
                </div>
            </div>
            
            <div id="music-player" class="flex column">
                <div id="track-info" class="flex column">
                    <div id="track-title">No track loaded</div>
                    <div id="track-artist" style="font-size: 14px; color: var(--pink);">Select a song</div>
                </div>

                <div class="player-progress-container">
                    <input type="range" id="progress-bar" value="0" min="0" max="100">
                </div>

                <div class="player-controls flex justify-center align-center wrap">
                    <button id="shuffle-btn" class="player-btn">🔀</button>
                    <button id="prev-btn" class="player-btn">⏮</button>
                    <button id="play-btn" class="player-btn">▶</button>
                    <button id="next-btn" class="player-btn">⏭</button>
