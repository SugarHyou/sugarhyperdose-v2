name: Deploy to Neocities

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Neocities
      uses: bepassport/neocities-action@v2
      with:
        api_token: ${{ secrets.NEOCITIES_TOKEN }}
        dist_dir: public
        cleanup: true